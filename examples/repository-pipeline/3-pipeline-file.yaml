apiVersion: azuredevops.krateo.io/v7-1
kind: GitPush
metadata: {name: example-repo-pipeline-file, namespace: krateo-system}
spec:
  configurationRef: {name: azuredevops, namespace: krateo-system}
  organization: ${ORG}
  project: ${PROJECT}
  repositoryId: ${REPO_ID}
  refUpdates:
    - name: refs/heads/main
      oldObjectId: "<main-head>"     # current objectId of refs/heads/main (compare-and-swap)
  commits:
    - comment: Add pipeline definition
      changes:
        - changeType: add
          item: {path: /azure-pipelines.yml}
          newContent:
            contentType: rawText
            content: |
              trigger: none
              pool:
                vmImage: ubuntu-latest
              steps:
                - script: echo hello
