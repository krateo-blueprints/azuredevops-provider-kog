apiVersion: azuredevops.krateo.io/v7-1
kind: GitPush
metadata: {name: example-repo-initial, namespace: krateo-system}
spec:
  configurationRef: {name: azuredevops, namespace: krateo-system}
  organization: ${ORG}
  project: ${PROJECT}
  repositoryId: example-repo        # repository name or id
  refUpdates:
    - name: refs/heads/main
      oldObjectId: "0000000000000000000000000000000000000000"   # the branch does not exist yet
  commits:
    - comment: Initial commit
      changes:
        - changeType: add
          item: {path: /README.md}
          newContent: {content: "# example-repo\n", contentType: rawText}
