apiVersion: v2
name: azuredevops-provider-kog-config
description: >-
  The per-kind <Kind>Configuration objects for azuredevops-provider-kog, all naming one Secret
  that holds an Azure DevOps PAT. A separate chart because these CRDs exist only after
  oasgen-provider has processed the azuredevops-provider-kog RestDefinitions. Holds no credential.
type: application
# release-oci substitutes every CHART_VERSION from the pushed semver tag (version and appVersion).
version: CHART_VERSION
appVersion: "CHART_VERSION"
keywords: [krateo, kog, azure-devops]
home: https://github.com/krateo-blueprints/azuredevops-provider-kog
sources:
  - https://github.com/krateo-blueprints/azuredevops-provider-kog
