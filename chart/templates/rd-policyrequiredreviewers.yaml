{{- if include "azuredevops-provider-kog.kindEnabled" (list . "PolicyRequiredReviewers") -}}
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: {{ .Release.Name }}-policyrequiredreviewers
  namespace: {{ .Release.Namespace }}
spec:
  oasPath: configmap://{{ .Release.Namespace }}/{{ .Release.Name }}-policyrequiredreviewers/policyrequiredreviewers.yaml
  resourceGroup: {{ .Values.resourceGroup }}
  resource:
    kind: PolicyRequiredReviewers
    # Azure DevOps allows ANY number of Required reviewers policies per branch, even with identical settings (measured),
    # so nothing in the spec identifies one: no identifiers and no findby. The kind observes by status.id
    # only and never adopts; a lost create response needs manual recovery (oasgen-provider#503).
    # Append-only once generated. id addresses get/update/delete; revision increments per update.
    additionalStatusFields:
      - id
      - revision
    compareScope: updatable
    configurationFields:
      - fromOpenAPI: {name: api-version, in: query}
        fromRestDefinition: {actions: ["*"]}
    verbsDescription:
      - action: create
        method: POST
        path: /{organization}/{project}/_apis/policy/configurations
      # Delete is soft: GET keeps answering 200 with isDeleted true (measured), which is absence here.
      - action: get
        method: GET
        path: /{organization}/{project}/_apis/policy/configurations/{configurationId}
        fieldMapping: &policyId
          - inPath: configurationId
            inCustomResource: status.id
        notFoundBody: {inline: '.isDeleted == true'}
      - action: update
        method: PUT
        path: /{organization}/{project}/_apis/policy/configurations/{configurationId}
        fieldMapping: *policyId
      - action: delete
        method: DELETE
        path: /{organization}/{project}/_apis/policy/configurations/{configurationId}
        fieldMapping: *policyId
{{- end }}
