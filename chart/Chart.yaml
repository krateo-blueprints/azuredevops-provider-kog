apiVersion: v2
name: azuredevops-provider-kog
description: >-
  Krateo KOG provider (oasgen-provider 0.55.0) exposing Azure DevOps (projects, Git
  repositories, pipelines, permissions, service connections, variable groups, artifact feeds,
  teams, groups and users) as azuredevops.krateo.io Kubernetes kinds. Every kind is native:
  the chart ships only RestDefinitions and trimmed OpenAPI specs, with no controller image
  and no proxy plugin.
type: application

# release-oci substitutes CHART_VERSION from the pushed semver tag.
version: CHART_VERSION
# No provider image is shipped; oasgen-provider spawns one rest-dynamic-controller per kind.
# appVersion tracks the OpenAPI/mapping revision.
appVersion: "0.0.1"

keywords:
  - krateo
  - kog
  - oasgen-provider
  - azure-devops
home: https://github.com/krateo-blueprints/azuredevops-provider-kog
sources:
  - https://github.com/krateo-blueprints/azuredevops-provider-kog
