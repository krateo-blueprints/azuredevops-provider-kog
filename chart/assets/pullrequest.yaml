          type: boolean
        isFork:
          description: True if the repository was created as a fork.
          type: boolean
        isInMaintenance:
          description: True if the repository is in maintenance. False otherwise.
          type: boolean
        name:
          type: string
        parentRepository:
          $ref: '#/components/schemas/GitRepositoryRef'
        project:
          $ref: '#/components/schemas/TeamProjectReference'
        remoteUrl:
          type: string
        size:
          description: Compressed size (bytes) of the repository.
          type: integer
          format: int64
        sshUrl:
          type: string
        url:
          type: string
        validRemoteUrls:
          type: array
          items:
            type: string
        webUrl:
          type: string
    GitRepositoryRef:
      description: ''
      type: object
      properties:
        collection:
          description: Team Project Collection where this Fork resides
          $ref: '#/components/schemas/TeamProjectCollectionReference'
        id:
          type: string
          format: uuid
        isFork:
          description: True if the repository was created as a fork
          type: boolean
        name:
          type: string
        project:
          $ref: '#/components/schemas/TeamProjectReference'
        remoteUrl:
          type: string
        sshUrl:
          type: string
        url:
          type: string
    GitStatus:
      description: This class contains the metadata of a service/extension posting a status.
      type: object
      properties:
        _links:
          description: Reference links.
          $ref: '#/components/schemas/ReferenceLinks'
        context:
          description: Context of the status.
          $ref: '#/components/schemas/GitStatusContext'
        createdBy:
          description: Identity that created the status.
          $ref: '#/components/schemas/IdentityRef'
        creationDate:
          description: Creation date and time of the status.
          type: string
          format: date-time
        description:
          description: Status description. Typically describes current state of the status.
          type: string
        id:
          description: Status identifier.
          type: integer
          format: int32
        state:
          description: State of the status.
          enum:
          - notSet
          - pending
          - succeeded
          - failed
          - error
          - notApplicable
          x-ms-enum:
            name: GitStatusState
            values:
            - value: notSet
              description: Status state not set. Default state.
            - value: pending
              description: Status pending.
            - value: succeeded
              description: Status succeeded.
            - value: failed
              description: Status failed.
            - value: error
              description: Status with an error.
            - value: notApplicable
              description: Status is not applicable to the target object.
        targetUrl:
          description: URL with status details.
          type: string
        updatedDate:
          description: Last update date and time of the status.
          type: string
          format: date-time
    GitStatusContext:
      description: Status context that uniquely identifies the status.
      type: object
      properties:
        genre:
          description: Genre of the status. Typically name of the service/tool generating the status,
            can be empty.
          type: string
        name:
          description: Name identifier of the status, cannot be null or empty.
          type: string
    GitTemplate:
      description: ''
      type: object
      properties:
        name:
          description: Name of the Template
          type: string
        type:
          description: Type of the Template
          type: string
    GitUserDate:
      description: User info and date for Git operations.
      type: object
      properties:
        date:
          description: Date of the Git operation.
          type: string
          format: date-time
        email:
          description: Email address of the user performing the Git operation.
          type: string
        imageUrl:
          description: Url for the user's avatar.
          type: string
        name:
          description: Name of the user performing the Git operation.
          type: string
    GraphSubjectBase:
      description: ''
      type: object
      properties:
        _links:
          description: This field contains zero or more interesting links about the graph subject. These
            links may be invoked to obtain additional relationships or more detailed information about
            this graph subject.
          $ref: '#/components/schemas/ReferenceLinks'
        descriptor:
          description: The descriptor is the primary way to reference the graph subject while the system
            is running. This field will uniquely identify the same graph subject across both Accounts
            and Organizations.
          type: string
        displayName:
          description: This is the non-unique display name of the graph subject. To change this field,
            you must alter its value in the source provider.
          type: string
        url:
          description: This url is the full route to the source resource of this graph subject.
          type: string
    IdentityRef:
      description: ''
      type: object
      allOf:
      - $ref: '#/components/schemas/GraphSubjectBase'
      properties:
        directoryAlias:
          description: Deprecated - Can be retrieved by querying the Graph user referenced in the "self"
            entry of the IdentityRef "_links" dictionary
          type: string
        id:
          type: string
        imageUrl:
          description: Deprecated - Available in the "avatar" entry of the IdentityRef "_links" dictionary
          type: string
        inactive:
          description: Deprecated - Can be retrieved by querying the Graph membership state referenced
            in the "membershipState" entry of the GraphUser "_links" dictionary
          type: boolean
        isAadIdentity:
          description: Deprecated - Can be inferred from the subject type of the descriptor (Descriptor.IsAadUserType/Descriptor.IsAadGroupType)
          type: boolean
        isContainer:
          description: Deprecated - Can be inferred from the subject type of the descriptor (Descriptor.IsGroupType)
          type: boolean
        isDeletedInOrigin:
          type: boolean
        profileUrl:
          description: Deprecated - not in use in most preexisting implementations of ToIdentityRef
          type: string
        uniqueName:
          description: Deprecated - use Domain+PrincipalName instead
          type: string
    IdentityRefWithVote:
      description: Identity information including a vote on a pull request.
      type: object
      allOf:
      - $ref: '#/components/schemas/IdentityRef'
      properties:
        hasDeclined:
          description: Indicates if this reviewer has declined to review this pull request.
          type: boolean
        isFlagged:
          description: Indicates if this reviewer is flagged for attention on this pull request.
          type: boolean
        isReapprove:
          description: Indicates if this approve vote should still be handled even though vote didn't
            change.
          type: boolean
        isRequired:
          description: Indicates if this is a required reviewer for this pull request. <br /> Branches
            can have policies that require particular reviewers are required for pull requests.
          type: boolean
        reviewerUrl:
          description: URL to retrieve information about this identity
          type: string
        vote:
          description: Vote on a pull request:<br /> 10 - approved 5 - approved with suggestions 0 - no
            vote -5 - waiting for author -10 - rejected
          type: integer
          format: int16
        votedFor:
          description: Groups or teams that this reviewer contributed to. <br /> Groups and teams can
            be reviewers on pull requests but can not vote directly.  When a member of the group or team
            votes, that vote is rolled up into the group or team vote.  VotedFor is a list of such votes.
          type: array
          items:
            $ref: '#/components/schemas/IdentityRefWithVote'
    ItemContent:
      description: ''
      type: object
      properties:
        content:
          type: string
        contentType:
          enum:
          - rawText
          - base64Encoded
          x-ms-enum:
            name: ItemContentType
            values:
            - value: rawText
              description: ''
            - value: base64Encoded
              description: ''
    PullRequestCreate:
      description: The request fields of a pull request create.
      type: object
      required:
      - sourceRefName
      - targetRefName
      - title
      properties:
        sourceRefName:
          type: string
          description: e.g. refs/heads/feature.
        targetRefName:
          type: string
          description: e.g. refs/heads/main.
        title:
          type: string
        description:
          type: string
        isDraft:
          type: boolean
    PullRequestUpdate:
      description: The fields a pull request update accepts here.
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        isDraft:
          type: boolean
        status:
          type: string
          enum:
          - active
          - abandoned
          description: Used by delete (abandon); not a spec field.
    ReferenceLinks:
      description: The class to represent a collection of REST reference links.
      type: object
      properties:
        links:
          description: The readonly view of the links.  Because Reference links are readonly, we only
            want to expose them as read only.
          type: object
          additionalProperties:
            type: object
    ResourceRef:
      description: ''
      type: object
      properties:
        id:
          type: string
        url:
          type: string
    TeamProjectCollectionReference:
      description: Reference object for a TeamProjectCollection.
      type: object
      properties:
        avatarUrl:
          description: Collection avatar Url.
          type: string
        id:
          description: Collection Id.
          type: string
          format: uuid
        name:
          description: Collection Name.
          type: string
        url:
          description: Collection REST Url.
          type: string
    TeamProjectReference:
      description: Represents a shallow reference to a TeamProject.
      type: object
      properties:
        abbreviation:
          description: Project abbreviation.
          type: string
        defaultTeamImageUrl:
          description: Url to default team identity image.
          type: string
        description:
          description: The project's description (if any).
          type: string
        id:
          description: Project identifier.
          type: string
          format: uuid
        lastUpdateTime:
          description: Project last update time.
          type: string
          format: date-time
        name:
          description: Project name.
          type: string
        revision:
          description: Project revision.
          type: integer
          format: int64
        state:
          description: Project state.
          enum:
          - deleting
          - new
          - wellFormed
          - createPending
          - all
          - unchanged
          - deleted
          x-ms-enum:
            name: ProjectState
            values:
            - value: deleting
              description: Project is in the process of being deleted.
            - value: new
              description: Project is in the process of being created.
            - value: wellFormed
              description: Project is completely created and ready to use.
            - value: createPending
              description: Project has been queued for creation, but the process has not yet started.
            - value: all
              description: All projects regardless of state except Deleted.
            - value: unchanged
              description: Project has not been changed.
            - value: deleted
              description: Project has been deleted.
        url:
          description: Url to the full version of the object.
          type: string
        visibility:
          description: Project visibility.
          enum:
          - private
          - public
          x-ms-enum:
            name: ProjectVisibility
            values:
            - value: private
              description: The project is only visible to users with explicit access.
            - value: public
              description: The project is visible to all.
    WebApiTagDefinition:
      description: The representation of a tag definition which is sent across the wire.
      type: object
      properties:
        active:
          description: Whether or not the tag definition is active.
          type: boolean
        id:
          description: ID of the tag definition.
          type: string
          format: uuid
        name:
          description: The name of the tag definition.
          type: string
        url:
          description: Resource URL for the Tag Definition.
          type: string
  securitySchemes:
    accessToken:
      type: http
      scheme: basic
      description: Personal access token. Use any value for the user name and the token as the password.
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          scopes:
            vso.code: Grants the ability to read source code and metadata about commits, changesets, branches,
              and other version control artifacts. Also grants the ability to search code and get notified
              about version control events via service hooks.
            vso.code_manage: Grants the ability to read, update, and delete source code, access metadata
              about commits, changesets, branches, and other version control artifacts. Also grants the
              ability to create and manage code repositories, create and manage pull requests and code
              reviews, and to receive notifications about version control events via service hooks.
            vso.code_write: Grants the ability to read, update, and delete source code, access metadata
              about commits, changesets, branches, and other version control artifacts. Also grants the
              ability to create and manage pull requests and code reviews and to receive notifications
              about version control events via service hooks.
            vso.code_status: Grants the ability to read and write commit and pull request status.
            vso.threads_full: Grants the ability to read and write to pull request comment threads.
          authorizationUrl: https://app.vssps.visualstudio.com/oauth2/authorize&response_type=Assertion
          tokenUrl: https://app.vssps.visualstudio.com/oauth2/token?client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer&grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer
