  schemas:
    Feed:
      description: A container for artifacts.
      type: object
      allOf:
      - $ref: '#/components/schemas/FeedCore'
      properties:
        _links:
          description: Related REST links.
          $ref: '#/components/schemas/ReferenceLinks'
        badgesEnabled:
          description: If set, this feed supports generation of package badges.
          type: boolean
        defaultViewId:
          description: The view that the feed administrator has indicated is the default experience for
            readers.
          type: string
          format: uuid
        deletedDate:
          description: The date that this feed was deleted.
          type: string
          format: date-time
        description:
          description: A description for the feed.  Descriptions must not exceed 255 characters.
          type: string
        hideDeletedPackageVersions:
          description: If set, the feed will hide all deleted/unpublished versions
          type: boolean
        permanentDeletedDate:
          description: The date that this feed was permanently deleted.
          type: string
          format: date-time
        permissions:
          description: Explicit permissions for the feed.
          type: array
          items:
            $ref: '#/components/schemas/FeedPermission'
        scheduledPermanentDeleteDate:
          description: The date that this feed is scheduled to be permanently deleted.
          type: string
          format: date-time
        upstreamEnabledChangedDate:
          description: If set, time that the UpstreamEnabled property was changed. Will be null if UpstreamEnabled
            was never changed after Feed creation.
          type: string
          format: date-time
        url:
          description: The URL of the base feed in GUID form.
          type: string
    FeedCore:
      description: An object that contains all of the settings for a specific feed.
      type: object
      properties:
        capabilities:
          description: Supported capabilities of a feed.
          enum:
          - none
          - upstreamV2
          - underMaintenance
          - defaultCapabilities
          x-ms-enum:
            name: FeedCapabilities
            values:
            - value: none
              description: No flags exist for this feed
            - value: upstreamV2
              description: This feed can serve packages from upstream sources Upstream packages must be
                manually promoted to views
            - value: underMaintenance
              description: This feed is currently under maintenance and may have reduced functionality
            - value: defaultCapabilities
              description: The capabilities given to a newly created feed
        fullyQualifiedId:
          description: This will either be the feed GUID or the feed GUID and view GUID depending on how
            the feed was accessed.
          type: string
        fullyQualifiedName:
          description: Full name of the view, in feed@view format.
          type: string
        id:
          description: A GUID that uniquely identifies this feed.
          type: string
          format: uuid
        isReadOnly:
          description: If set, all packages in the feed are immutable.  It is important to note that feed
            views are immutable; therefore, this flag will always be set for views.
          type: boolean
        name:
          description: 'A name for the feed. feed names must follow these rules: <list type="bullet"><item><description>
            Must not exceed 64 characters </description></item><item><description> Must not contain whitespaces
            </description></item><item><description> Must not start with an underscore or a period </description></item><item><description>
            Must not end with a period </description></item><item><description> Must not contain any of
            the following illegal characters: <![CDATA[ @, ~, ;, {, }, \, +, =, <, >, |, /, \\, ?, :,
            &, $, *, \", #, [, ] ]]></description></item></list>'
          type: string
        project:
          description: The project that this feed is associated with.
          $ref: '#/components/schemas/ProjectReference'
        upstreamEnabled:
          description: This should always be true. Setting to false will override all sources in UpstreamSources.
          type: boolean
        upstreamSources:
          description: A list of sources that this feed will fetch packages from.  An empty list indicates
            that this feed will not search any additional sources for packages.
          type: array
          items:
            $ref: '#/components/schemas/UpstreamSource'
        view:
          description: Definition of the view.
          $ref: '#/components/schemas/FeedView'
        viewId:
          description: View Id.
          type: string
          format: uuid
        viewName:
          description: View name.
          type: string
    FeedCreate:
      description: The request fields of a feed create.
      type: object
      required:
      - name
      properties:
        name:
          type: string
        description:
          type: string
        badgesEnabled:
          type: boolean
          description: Package badges.
        hideDeletedPackageVersions:
          type: boolean
    FeedPermission:
      description: Permissions for a feed.
      type: object
      properties:
        displayName:
          description: Display name for the identity.
          type: string
        identityDescriptor:
          description: Identity associated with this role.
          $ref: '#/components/schemas/IdentityDescriptor'
        identityId:
          description: Id of the identity associated with this role.
          type: string
          format: uuid
        isInheritedRole:
          description: Boolean indicating whether the role is inherited or set directly.
          type: boolean
        role:
          description: The role for this identity on a feed.
          enum:
          - custom
          - none
          - reader
          - contributor
          - administrator
          - collaborator
          x-ms-enum:
            name: FeedRole
            values:
            - value: custom
              description: Unsupported.
            - value: none
              description: Unsupported.
            - value: reader
              description: Readers can only read packages and view settings.
            - value: contributor
              description: Contributors can do anything to packages in the feed including adding new packages,
                but they may not modify feed settings.
            - value: administrator
              description: Administrators have total control over the feed.
            - value: collaborator
              description: Collaborators have the same permissions as readers, but can also ingest packages
                from configured upstream sources.
    FeedUpdate:
      description: The fields a feed update accepts here.
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        badgesEnabled:
          type: boolean
        hideDeletedPackageVersions:
          type: boolean
    FeedView:
      description: A view on top of a feed.
      type: object
      properties:
        _links:
          description: Related REST links.
          $ref: '#/components/schemas/ReferenceLinks'
        id:
          description: Id of the view.
          type: string
          format: uuid
        name:
          description: Name of the view.
          type: string
        type:
          description: Type of view.
          enum:
          - none
          - release
          - implicit
          x-ms-enum:
            name: FeedViewType
            values:
            - value: none
              description: Default, unspecified view type.
            - value: release
              description: View used as a promotion destination to classify released artifacts.
            - value: implicit
              description: Internal view type that is automatically created and managed by the system.
        url:
          description: Url of the view.
          type: string
        visibility:
          description: Visibility status of the view.
          enum:
          - private
          - collection
          - organization
          - aadTenant
          x-ms-enum:
            name: FeedVisibility
            values:
            - value: private
              description: Only accessible by the permissions explicitly set by the feed administrator.
            - value: collection
              description: Feed is accessible by all the valid users present in the organization where
                the feed resides (for example across organization 'myorg' at 'dev.azure.com/myorg')
            - value: organization
              description: Feed is accessible by all the valid users present in the enterprise where the
                feed resides. Note that legacy naming and back compat leaves the name of this value out
                of sync with its new meaning.
            - value: aadTenant
              description: Feed is accessible by all the valid users present in the Azure Active Directory
                tenant.
    IdentityDescriptor:
      description: An Identity descriptor is a wrapper for the identity type (Windows SID, Passport) along
        with a unique identifier such as the SID or PUID.
      type: object
      properties:
        identifier:
          description: The unique identifier for this identity, not exceeding 256 chars, which will be
            persisted.
          type: string
        identityType:
          description: Type of descriptor (for example, Windows, Passport, etc.).
          type: string
    ProjectReference:
      description: ''
      type: object
      properties:
        id:
          description: Gets or sets id of the project.
          type: string
          format: uuid
        name:
          description: Gets or sets name of the project.
          type: string
        visibility:
          description: Gets or sets visibility of the project.
          type: string
    ReferenceLinks:
      description: The class to represent a collection of REST reference links.
      type: object
      properties:
        links:
          description: The readonly view of the links.  Because Reference links are readonly, we only
            want to expose them as read only.
          type: object
          additionalProperties:
            type: object
    UpstreamSource:
      description: Upstream source definition, including its Identity, package type, and other associated
        information.
      type: object
      properties:
        deletedDate:
          description: UTC date that this upstream was deleted.
          type: string
          format: date-time
        displayLocation:
          description: Locator for connecting to the upstream source in a user friendly format, that may
            potentially change over time
          type: string
        id:
          description: Identity of the upstream source.
          type: string
          format: uuid
        internalUpstreamCollectionId:
          description: For an internal upstream type, track the Azure DevOps organization that contains
            it.
          type: string
          format: uuid
        internalUpstreamFeedId:
          description: For an internal upstream type, track the feed id being referenced.
          type: string
          format: uuid
        internalUpstreamProjectId:
          description: For an internal upstream type, track the project of the feed being referenced.
          type: string
          format: uuid
        internalUpstreamViewId:
          description: For an internal upstream type, track the view of the feed being referenced.
          type: string
          format: uuid
        location:
          description: Consistent locator for connecting to the upstream source.
          type: string
        name:
          description: Display name.
          type: string
        protocol:
          description: Package type associated with the upstream source.
          type: string
        serviceEndpointId:
          description: The identity of the service endpoint that holds credentials to use when accessing
            the upstream.
          type: string
          format: uuid
        serviceEndpointProjectId:
          description: Specifies the projectId of the Service Endpoint.
          type: string
          format: uuid
        status:
          description: Specifies the status of the upstream.
          enum:
          - ok
          - disabled
          x-ms-enum:
            name: UpstreamStatus
            values:
            - value: ok
              description: Upstream source is ok.
            - value: disabled
              description: Upstream source is disabled.
        statusDetails:
          description: Provides a human-readable reason for the status of the upstream.
          type: array
          items:
            $ref: '#/components/schemas/UpstreamStatusDetail'
        upstreamSourceType:
          description: Source type, such as Public or Internal.
          enum:
          - public
          - internal
          x-ms-enum:
            name: UpstreamSourceType
            values:
            - value: public
              description: Publicly available source.
            - value: internal
              description: Azure DevOps upstream source.
    UpstreamStatusDetail:
      description: ''
      type: object
      properties:
        reason:
          description: Provides a human-readable reason for the status of the upstream.
          type: string
  securitySchemes:
    accessToken:
      type: http
      scheme: basic
      description: Personal access token. Use any value for the user name and the token as the password.
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
