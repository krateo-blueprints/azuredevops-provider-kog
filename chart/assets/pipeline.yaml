      type: object
      properties:
        definition:
          description: A reference to the build option.
          $ref: '#/components/schemas/BuildOptionDefinitionReference'
        enabled:
          description: Indicates whether the behavior is enabled.
          type: boolean
        inputs:
          type: object
          additionalProperties:
            type: string
    BuildOptionDefinitionReference:
      description: Represents a reference to a build option definition.
      type: object
      properties:
        id:
          description: The ID of the referenced build option.
          type: string
          format: uuid
    BuildProcess:
      description: Represents a build process.
      type: object
      properties:
        type:
          description: The type of the process.
          type: integer
          format: int32
    BuildRepository:
      description: Represents a repository used by a build definition.
      type: object
      properties:
        checkoutSubmodules:
          description: Indicates whether to checkout submodules.
          type: boolean
        clean:
          description: Indicates whether to clean the target folder when getting code from the repository.
          type: string
        defaultBranch:
          description: The name of the default branch.
          type: string
        id:
          description: The ID of the repository.
          type: string
        name:
          description: The friendly name of the repository.
          type: string
        properties:
          type: object
          additionalProperties:
            type: string
        rootFolder:
          description: The root folder.
          type: string
        type:
          description: The type of the repository.
          type: string
        url:
          description: The URL of the repository.
          type: string
    BuildRequestValidationResult:
      description: Represents the result of validating a build request.
      type: object
      properties:
        message:
          description: The message associated with the result.
          type: string
        result:
          description: The result.
          enum:
          - ok
          - warning
          - error
          x-ms-enum:
            name: ValidationResult
            values:
            - value: ok
              description: ''
            - value: warning
              description: ''
            - value: error
              description: ''
    BuildTrigger:
      description: Represents a trigger for a buld definition.
      type: object
      properties:
        triggerType:
          description: The type of the trigger.
          enum:
          - none
          - continuousIntegration
          - batchedContinuousIntegration
          - schedule
          - gatedCheckIn
          - batchedGatedCheckIn
          - pullRequest
          - buildCompletion
          - all
          x-ms-enum:
            name: DefinitionTriggerType
            values:
            - value: none
              description: Manual builds only.
            - value: continuousIntegration
              description: A build should be started for each changeset.
            - value: batchedContinuousIntegration
              description: A build should be started for multiple changesets at a time at a specified
                interval.
            - value: schedule
              description: A build should be started on a specified schedule whether or not changesets
                exist.
            - value: gatedCheckIn
              description: A validation build should be started for each check-in.
            - value: batchedGatedCheckIn
              description: A validation build should be started for each batch of check-ins.
            - value: pullRequest
              description: A build should be triggered when a GitHub pull request is created or updated.
                Added in resource version 3
            - value: buildCompletion
              description: A build should be triggered when another build completes.
            - value: all
              description: All types.
    DataSourceBindingBase:
      description: Represents binding of data source for the service endpoint request.
      type: object
      properties:
        callbackContextTemplate:
          description: Pagination format supported by this data source(ContinuationToken/SkipTop).
          type: string
        callbackRequiredTemplate:
          description: Subsequent calls needed?
          type: string
        dataSourceName:
          description: Gets or sets the name of the data source.
          type: string
        endpointId:
          description: Gets or sets the endpoint Id.
          type: string
        endpointUrl:
          description: Gets or sets the url of the service endpoint.
          type: string
        headers:
          description: Gets or sets the authorization headers.
          type: array
          items:
            $ref: '#/components/schemas/AuthorizationHeader'
        initialContextTemplate:
          description: Defines the initial value of the query params
          type: string
        parameters:
          description: Gets or sets the parameters for the data source.
          type: object
          additionalProperties:
            type: string
        requestContent:
          description: Gets or sets http request body
          type: string
        requestVerb:
          description: Gets or sets http request verb
          type: string
        resultSelector:
          description: Gets or sets the result selector.
          type: string
        resultTemplate:
          description: Gets or sets the result template.
          type: string
        target:
          description: Gets or sets the target of the data source.
          type: string
    DefinitionReference:
      description: Represents a reference to a definition.
      type: object
      properties:
        createdDate:
          description: The date this version of the definition was created.
          type: string
          format: date-time
        id:
          description: The ID of the referenced definition.
          type: integer
          format: int32
        name:
          description: The name of the referenced definition.
          type: string
        path:
          description: The folder path of the definition.
          type: string
        project:
          description: A reference to the project.
          $ref: '#/components/schemas/TeamProjectReference'
        queueStatus:
          description: A value that indicates whether builds can be queued against this definition.
          enum:
          - enabled
          - paused
          - disabled
          x-ms-enum:
            name: DefinitionQueueStatus
            values:
            - value: enabled
              description: When enabled the definition queue allows builds to be queued by users, the
                system will queue scheduled, gated and continuous integration builds, and the queued builds
                will be started by the system.
            - value: paused
              description: When paused the definition queue allows builds to be queued by users and the
                system will queue scheduled, gated and continuous integration builds. Builds in the queue
                will not be started by the system.
            - value: disabled
              description: When disabled the definition queue will not allow builds to be queued by users
                and the system will not queue scheduled, gated or continuous integration builds. Builds
                already in the queue will not be started by the system.
        revision:
          description: The definition revision number.
          type: integer
          format: int32
        type:
          description: The type of the definition.
          enum:
          - xaml
          - build
          x-ms-enum:
            name: DefinitionType
            values:
            - value: xaml
              description: ''
            - value: build
              description: ''
        uri:
          description: The definition's URI.
          type: string
        url:
          description: The REST URL of the definition.
          type: string
    Demand:
      description: Represents a demand used by a definition or build.
      type: object
      properties:
        name:
          description: The name of the capability referenced by the demand.
          type: string
        value:
          description: The demanded value.
          type: string
    GraphSubjectBase:
      description: ''
      type: object
      properties:
        _links:
          description: This field contains zero or more interesting links about the graph subject. These
            links may be invoked to obtain additional relationships or more detailed information about
            this graph subject.
          $ref: '#/components/schemas/ReferenceLinks'
        descriptor:
          description: The descriptor is the primary way to reference the graph subject while the system
            is running. This field will uniquely identify the same graph subject across both Accounts
            and Organizations.
          type: string
        displayName:
          description: This is the non-unique display name of the graph subject. To change this field,
            you must alter its value in the source provider.
          type: string
        url:
          description: This url is the full route to the source resource of this graph subject.
          type: string
    IdentityRef:
      description: ''
      type: object
      allOf:
      - $ref: '#/components/schemas/GraphSubjectBase'
      properties:
        directoryAlias:
          description: Deprecated - Can be retrieved by querying the Graph user referenced in the "self"
            entry of the IdentityRef "_links" dictionary
          type: string
        id:
          type: string
        imageUrl:
          description: Deprecated - Available in the "avatar" entry of the IdentityRef "_links" dictionary
          type: string
        inactive:
          description: Deprecated - Can be retrieved by querying the Graph membership state referenced
            in the "membershipState" entry of the GraphUser "_links" dictionary
          type: boolean
        isAadIdentity:
          description: Deprecated - Can be inferred from the subject type of the descriptor (Descriptor.IsAadUserType/Descriptor.IsAadGroupType)
          type: boolean
        isContainer:
          description: Deprecated - Can be inferred from the subject type of the descriptor (Descriptor.IsGroupType)
          type: boolean
        isDeletedInOrigin:
          type: boolean
        profileUrl:
          description: Deprecated - not in use in most preexisting implementations of ToIdentityRef
          type: string
        uniqueName:
          description: Deprecated - use Domain+PrincipalName instead
          type: string
    PipelineDefinition:
      description: The request fields of a YAML pipeline definition. The full BuildDefinition also carries
        designer-pipeline, retention, trigger and server-side fields that do not apply to a YAML pipeline
        (whose triggers and pool live in its YAML file).
      type: object
      required:
      - name
      - process
      - repository
      properties:
        name:
          type: string
          description: Pipeline name.
        path:
          type: string
          description: 'Folder, in Azure DevOps''s own form: ''\'' for the root, ''\team\ci'' for a subfolder.'
        process:
          type: object
          required:
          - type
          - yamlFilename
          properties:
            type:
              type: integer
              format: int32
              enum:
              - 2
              description: 2 = YAML process.
            yamlFilename:
              type: string
              description: Path of the pipeline YAML file in the repository.
        repository:
          type: object
          required:
          - id
          - type
          properties:
            id:
              type: string
              description: Repository id.
            type:
              type: string
              description: Repository type, e.g. TfsGit for Azure Repos.
            defaultBranch:
              type: string
              description: Branch builds default to, e.g. refs/heads/main.
    PipelineDefinitionUpdate:
      description: The update body is the definition plus the id and revision it replaces.
      type: object
      required:
      - id
      - revision
      - name
      - process
      - repository
      allOf:
      - $ref: '#/components/schemas/PipelineDefinition'
      properties:
        id:
          type: integer
          format: int32
        revision:
          type: integer
          format: int32
          description: Must equal the current revision (optimistic concurrency).
    ProcessParameters:
      description: ''
      type: object
      properties:
        dataSourceBindings:
          type: array
          items:
            $ref: '#/components/schemas/DataSourceBindingBase'
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/TaskInputDefinitionBase'
        sourceDefinitions:
          type: array
          items:
            $ref: '#/components/schemas/TaskSourceDefinitionBase'
    PropertiesCollection:
      description: The class represents a property bag as a collection of key-value pairs. Values of all
        primitive types (any type with a `TypeCode != TypeCode.Object`) except for `DBNull` are accepted.
        Values of type Byte[], Int32, Double, DateType and String preserve their type, other primitives
        are retuned as a String. Byte[] expected as base64 encoded string.
      type: object
      properties:
        count:
          description: The count of properties in the collection.
          type: integer
          format: int32
        item:
          type: object
        keys:
          description: The set of keys in the collection.
          type: array
          items:
            type: string
        values:
          description: The set of values in the collection.
          type: array
          items:
            type: string
    ReferenceLinks:
      description: The class to represent a collection of REST reference links.
      type: object
      properties:
        links:
          description: The readonly view of the links.  Because Reference links are readonly, we only
            want to expose them as read only.
          type: object
          additionalProperties:
            type: object
    RetentionPolicy:
      description: Represents a retention policy for a build definition.
      type: object
      properties:
        artifacts:
          type: array
          items:
            type: string
        artifactTypesToDelete:
          type: array
          items:
            type: string
        branches:
          type: array
          items:
            type: string
        daysToKeep:
          description: The number of days to keep builds.
          type: integer
          format: int32
        deleteBuildRecord:
          description: Indicates whether the build record itself should be deleted.
          type: boolean
        deleteTestResults:
          description: Indicates whether to delete test results associated with the build.
          type: boolean
        minimumToKeep:
          description: The minimum number of builds to keep.
          type: integer
          format: int32
    TaskAgentPoolReference:
      description: Represents a reference to an agent pool.
      type: object
      properties:
        id:
          description: The pool ID.
          type: integer
          format: int32
        isHosted:
          description: A value indicating whether or not this pool is managed by the service.
          type: boolean
        name:
          description: The pool name.
          type: string
    TaskInputDefinitionBase:
      description: ''
      type: object
      properties:
        aliases:
          type: array
          items:
            type: string
        defaultValue:
          type: string
        groupName:
          type: string
        helpMarkDown:
          type: string
        label:
          type: string
        name:
          type: string
        options:
          type: object
          additionalProperties:
            type: string
        properties:
          type: object
          additionalProperties:
            type: string
        required:
          type: boolean
        type:
          type: string
        validation:
          $ref: '#/components/schemas/TaskInputValidation'
        visibleRule:
          type: string
    TaskInputValidation:
      description: ''
      type: object
      properties:
        expression:
          description: Conditional expression
          type: string
        message:
          description: Message explaining how user can correct if validation fails
          type: string
    TaskOrchestrationPlanReference:
      description: Represents a reference to an orchestration plan.
      type: object
      properties:
        orchestrationType:
          description: The type of the plan.
          type: integer
          format: int32
        planId:
          description: The ID of the plan.
          type: string
          format: uuid
    TaskSourceDefinitionBase:
      description: ''
      type: object
      properties:
        authKey:
          type: string
        endpoint:
          type: string
        keySelector:
          type: string
        selector:
          type: string
        target:
          type: string
    TeamProjectReference:
      description: Represents a shallow reference to a TeamProject.
      type: object
      properties:
        abbreviation:
          description: Project abbreviation.
          type: string
        defaultTeamImageUrl:
          description: Url to default team identity image.
          type: string
        description:
          description: The project's description (if any).
          type: string
        id:
          description: Project identifier.
          type: string
          format: uuid
        lastUpdateTime:
          description: Project last update time.
          type: string
          format: date-time
        name:
          description: Project name.
          type: string
        revision:
          description: Project revision.
          type: integer
          format: int64
        state:
          description: Project state.
          enum:
          - deleting
          - new
          - wellFormed
          - createPending
          - all
          - unchanged
          - deleted
          x-ms-enum:
            name: ProjectState
            values:
            - value: deleting
              description: Project is in the process of being deleted.
            - value: new
              description: Project is in the process of being created.
            - value: wellFormed
              description: Project is completely created and ready to use.
            - value: createPending
              description: Project has been queued for creation, but the process has not yet started.
            - value: all
              description: All projects regardless of state except Deleted.
            - value: unchanged
              description: Project has not been changed.
            - value: deleted
              description: Project has been deleted.
        url:
          description: Url to the full version of the object.
          type: string
        visibility:
          description: Project visibility.
          enum:
          - private
          - public
          x-ms-enum:
            name: ProjectVisibility
            values:
            - value: private
              description: The project is only visible to users with explicit access.
            - value: public
              description: The project is visible to all.
    VariableGroup:
      description: Represents a variable group.
      type: object
      allOf:
      - $ref: '#/components/schemas/VariableGroupReference'
      properties:
        description:
          description: The description.
          type: string
        name:
          description: The name of the variable group.
          type: string
        type:
          description: The type of the variable group.
          type: string
        variables:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/BuildDefinitionVariable'
    VariableGroupReference:
      description: Represents a reference to a variable group.
      type: object
      properties:
        alias:
          description: The Name of the variable group.
          type: string
        id:
          description: The ID of the variable group.
          type: integer
          format: int32
    XamlBuildControllerReference:
      description: ''
      type: object
      properties:
        id:
          description: Id of the resource
          type: integer
          format: int32
        name:
          description: Name of the linked resource (definition name, controller name, etc.)
          type: string
        url:
          description: Full http link to the resource
          type: string
  securitySchemes:
    accessToken:
      type: http
      scheme: basic
      description: Personal access token. Use any value for the user name and the token as the password.
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          scopes:
            vso.build: Grants the ability to access build artifacts, including build results, definitions,
              and requests, and the ability to receive notifications about build events via service hooks.
            vso.build_execute: Grants the ability to access build artifacts, including build results,
              definitions, and requests, and the ability to queue a build, update build properties, and
              the ability to receive notifications about build events via service hooks.
            vso.work: Grants the ability to read work items, queries, boards, area and iterations paths,
              and other work item tracking related metadata. Also grants the ability to execute queries,
              search work items and to receive notifications about work item events via service hooks.
            vso.project: Grants the ability to read projects and teams.
            vso.project_write: Grants the ability to read and update projects and teams.
            vso.pipelineresources_manage: 'Grants the ability to manage a protected resource or a pipeline''s
              request to use a protected resource: agent pool, environment, queue, repository, secure
              files, service connection, and variable group'
          authorizationUrl: https://app.vssps.visualstudio.com/oauth2/authorize&response_type=Assertion
          tokenUrl: https://app.vssps.visualstudio.com/oauth2/token?client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer&grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer
