- op: set
  at:
  - definitions
  - RepositoryPermission
  value:
    description: The desired access control entry of one group on a repository (or on every repository of a project).
    type: object
    required:
    - projectId
    - subjectDescriptor
    - permissions
    properties:
      projectId:
        type: string
        description: The project's id (GUID).
      repositoryId:
        type: string
        description: 'The repository''s id (GUID). Absent: every repository of the project.'
      subjectDescriptor:
        type: string
        pattern: ^vssgp\.
        description: The group's Graph descriptor (vssgp.…), e.g. a Group's status.descriptor.
      permissions:
        type: object
        description: 'Allow, Deny or NotSet per permission. Every permission defaults to NotSet, so the map is the
          WHOLE desired entry: a bit set outside the CR on a permission the spec does not list reads as drift and
          is cleared.'
        properties:
          Administer:
            type: string
            enum:
            - Allow
            - Deny
            - NotSet
            default: NotSet
          GenericRead:
            type: string
            enum:
            - Allow
            - Deny
            - NotSet
            default: NotSet
          GenericContribute:
            type: string
            enum:
            - Allow
            - Deny
            - NotSet
            default: NotSet
          ForcePush:
            type: string
            enum:
            - Allow
            - Deny
            - NotSet
            default: NotSet
          CreateBranch:
            type: string
            enum:
            - Allow
            - Deny
            - NotSet
            default: NotSet
          CreateTag:
            type: string
            enum:
            - Allow
            - Deny
            - NotSet
            default: NotSet
          ManageNote:
            type: string
            enum:
            - Allow
            - Deny
            - NotSet
            default: NotSet
          PolicyExempt:
            type: string
            enum:
            - Allow
            - Deny
            - NotSet
            default: NotSet
          CreateRepository:
            type: string
            enum:
            - Allow
            - Deny
            - NotSet
            default: NotSet
          DeleteRepository:
            type: string
            enum:
            - Allow
            - Deny
            - NotSet
            default: NotSet
          RenameRepository:
            type: string
            enum:
            - Allow
            - Deny
            - NotSet
            default: NotSet
          EditPolicies:
            type: string
            enum:
            - Allow
            - Deny
            - NotSet
            default: NotSet
          RemoveOthersLocks:
            type: string
            enum:
            - Allow
            - Deny
            - NotSet
            default: NotSet
          ManagePermissions:
            type: string
            enum:
            - Allow
            - Deny
            - NotSet
            default: NotSet
          PullRequestContribute:
            type: string
            enum:
            - Allow
            - Deny
            - NotSet
            default: NotSet
          PullRequestBypassPolicy:
            type: string
            enum:
            - Allow
            - Deny
            - NotSet
            default: NotSet
          ViewAdvSecAlerts:
            type: string
            enum:
            - Allow
            - Deny
            - NotSet
            default: NotSet
          DismissAdvSecAlerts:
            type: string
            enum:
            - Allow
            - Deny
            - NotSet
            default: NotSet
          ManageAdvSecScanning:
            type: string
            enum:
            - Allow
            - Deny
            - NotSet
            default: NotSet
          ManageEnterpriseLiveMigrations:
            type: string
            enum:
            - Allow
            - Deny
            - NotSet
            default: NotSet
          PullRequestBypassReviewer:
            type: string
            enum:
            - Allow
            - Deny
            - NotSet
            default: NotSet
  reason: 'The source types the write body as JObject (untyped). The entry is defined by a token (repoV2/<projectId>[/<repositoryId>],
    measured), an IDENTITY descriptor and allow/deny bit masks. This schema states them in user terms: ids, a group''s
    Graph descriptor (from which the identity descriptor is derived: measured 2026-11-08, base64-decoding the vssgp.
    descriptor yields exactly the SID of the identity descriptor) and named permissions (bits from the namespace''s
    measured action list). The RestDefinition''s transforms build the wire body and read it back.'
