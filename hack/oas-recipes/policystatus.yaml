# PolicyStatus: the "Status" branch policy. Any number per branch.
source:
  area: policy
  file: policy.json
  swhid: swh:1:cnt:a7889097775296f2cfc948227c0e242877c50f1d
info:
  title: Azure DevOps - Status branch policies
keep:
  /{organization}/{project}/_apis/policy/configurations:
  - post
  /{organization}/{project}/_apis/policy/configurations/{configurationId}:
  - get
  - put
  - delete
operationSecurity: accessToken
patches:
- op: set
  at:
  - definitions
  - PolicyStatusSettings
  value:
    type: object
    required:
    - scope
    - statusName
    - invalidateOnSourceUpdate
    properties:
      statusName: &id001
        type: string
      statusGenre: *id001
      invalidateOnSourceUpdate:
        type: boolean
      authorId:
        type: string
        description: Only this identity may post the status.
      defaultDisplayName: *id001
      policyApplicability:
        type: integer
        format: int32
        description: null/0 = applies by default; 1 = applies only when a status is posted.
      filenamePatterns:
        type: array
        items: *id001
        description: Paths the policy applies to (e.g. /src/*, !/docs/*); all paths when absent.
      scope:
        type: array
        minItems: 1
        items:
          type: object
          required:
          - repositoryId
          - refName
          - matchKind
          properties:
            repositoryId:
              type: string
              description: Repository id (GUID).
            refName:
              type: string
              description: e.g. refs/heads/main, or refs/heads/release/ with matchKind Prefix.
            matchKind:
              type: string
              enum:
              - Exact
              - Prefix
              - DefaultBranch
  reason: The Status settings as measured 2026-11-08 (unset strings come back null; invalidateOnSourceUpdate is
    required (400 without it)); shared by the request and the response.
- op: set
  at:
  - definitions
  - PolicyConfiguration
  - properties
  - settings
  value: &id002
    $ref: '#/definitions/PolicyStatusSettings'
  reason: The source types settings as a free-form object; this document describes Status policies only, whose settings
    are returned exactly as sent plus server defaults (measured), so the response is typed the same way.
- op: set
  at:
  - definitions
  - PolicyStatus
  value:
    description: The request fields of a Status branch policy.
    type: object
    required:
    - type
    - settings
    properties:
      isEnabled:
        type: boolean
        default: true
      isBlocking:
        type: boolean
        default: true
        description: Required (blocking) or optional.
      type:
        type: object
        description: Always the Status policy type (defaulted).
        default:
          id: cbdc66da-9728-4af8-aada-9a5a32e4a226
        required:
        - id
        properties:
          id:
            type: string
            enum:
            - cbdc66da-9728-4af8-aada-9a5a32e4a226
      settings: *id002
  reason: The source types policy settings as a free-form object; a branch policy is defined by its type-specific
    settings (Microsoft Learn, Policy Configurations - Create, 7.1, and the Status type). This kind fixes the type
    to Status (defaulted) and types its settings as measured 2026-11-08 (unset strings come back null; invalidateOnSourceUpdate
    is required (400 without it)). Several policies of this type may guard the same branch, even with identical
    settings (measured 2026-11-08). Scope matchKind is stored and returned capitalised (sent 'exact', read 'Exact'),
    so the enum uses the stored casing.
- op: set
  at:
  - paths
  - /{organization}/{project}/_apis/policy/configurations
  - post
  - parameters
  - 1
  - schema
  value:
    $ref: '#/definitions/PolicyStatus'
  reason: Points the create body at PolicyStatus.
- op: set
  at:
  - paths
  - /{organization}/{project}/_apis/policy/configurations/{configurationId}
  - put
  - parameters
  - 1
  - schema
  value:
    $ref: '#/definitions/PolicyStatus'
  reason: Measured 2026-11-08, PUT replaces the policy with the full create-shaped body (no id or revision needed;
    revision increments). Points it at PolicyStatus.
- op: set
  at:
  - paths
  - /{organization}/{project}/_apis/policy/configurations/{configurationId}
  - delete
  - responses
  value:
    '204':
      description: The policy was deleted.
  reason: Measured 2026-11-08, delete returns 204 No Content; the source declares 200.
