# Group: an Azure DevOps security group in a project (or the organisation), served from
# vssps.dev.azure.com. Update is a JSON Patch; delete leaves a readable tombstone.
source:
  area: graph
  file: graph.json
  swhid: swh:1:cnt:5efa63f83c417d8abd9fda3d027da3ccf48b364d
info:
  title: Azure DevOps - Graph groups
keep:
  '/{organization}/_apis/graph/groups': [get, post]
  '/{organization}/_apis/graph/groups/{groupDescriptor}': [get, patch, delete]
# HYGIENE (inert for oasgen-provider generation): see hack/trim-oas.py step 0.
operationSecurity: accessToken
patches:
  - op: set
    at: [definitions, GroupCreate]
    value:
      description: The request fields of a group create.
      type: object
      required: [displayName]
      properties:
        displayName: {type: string}
        description: {type: string}
    reason: >-
      The source types the create body as GraphGroupCreationContext, whose only property is
      storageKey (the AAD-group variant). A new Azure DevOps group is created from the VSTS context:
      displayName and description (Microsoft Learn, Groups - Create, 7.1; measured 2026-11-08: 201
      with the group). Measured: a create with the displayName of an existing group in the same scope
      returns 201 with THAT group's descriptor and leaves its description unchanged, so a second create
      never duplicates.
  - op: set
    at: [definitions, GroupUpdate]
    value:
      description: >-
        The fields an update can change. The request is sent as an RFC 6902 JSON Patch built from
        these by the RestDefinition's requestTransform.
      type: object
      properties:
        displayName: {type: string}
        description: {type: string}
    reason: >-
      The source types the PATCH body as JsonPatchDocument (an array of operations), which describes
      the wire format but not which fields a patch may target. Measured 2026-11-08: replace on
      /displayName renames and replace on /description changes the description; a plain JSON object
      body is refused with 400. This schema declares the changeable fields so drift comparison
      (compareScope updatable) knows them; the transform turns them into the patch, sent with the
      operation's media type application/json-patch+json (oasgen-provider sends array bodies since
      0.43.0).
  - op: set
    at: [paths, '/{organization}/_apis/graph/groups', post, parameters, 1, schema]
    value: {$ref: '#/definitions/GroupCreate'}
    reason: Points the create body at GroupCreate.
  - op: set
    at: [paths, '/{organization}/_apis/graph/groups/{groupDescriptor}', patch, parameters, 2, schema]
    value: {$ref: '#/definitions/GroupUpdate'}
    reason: Points the update body at GroupUpdate (see its reason); the media type stays JSON Patch.
  - op: set
    at: [paths, '/{organization}/_apis/graph/groups', post, responses]
    value: {'201': {description: The group was created (or the same-named group returned)., schema: {$ref: '#/definitions/GraphGroup'}}}
    reason: Measured 2026-11-08, create returns 201 Created; the source declares 200.
  - op: set
    at: [paths, '/{organization}/_apis/graph/groups/{groupDescriptor}', delete, responses]
    value: {'204': {description: The group was deleted.}}
    reason: Measured 2026-11-08, delete returns 204 No Content; the source declares 200.
  - op: set
    at: [paths, '/{organization}/_apis/graph/groups', get, responses, '200', schema]
    value:
      type: object
      properties:
        count: {type: integer, format: int32}
        value: {type: array, items: {$ref: '#/definitions/GraphGroup'}}
    reason: Measured 2026-11-08, the list returns a {count, value} envelope; deleted groups are not listed.
  - op: set
    at: [definitions, GraphGroup, properties, isDeleted]
    value: {type: boolean, description: True on a deleted group; GET keeps answering 200 with it.}
    reason: >-
      Measured 2026-11-08: after DELETE (204), GET of the group still returns 200 with the group and
      isDeleted true (absent on a live group), and its membership state is active false. The source
      schema omits the field.
