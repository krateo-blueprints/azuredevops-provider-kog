# PolicyRequiredReviewers: the "Required reviewers" branch policy. Any number per branch.
source:
  area: policy
  file: policy.json
  swhid: swh:1:cnt:a7889097775296f2cfc948227c0e242877c50f1d
info:
  title: Azure DevOps - Required reviewers branch policies
keep:
  /{organization}/{project}/_apis/policy/configurations:
  - post
  /{organization}/{project}/_apis/policy/configurations/{configurationId}:
  - get
  - put
  - delete
operationSecurity: accessToken
patches:
- op: set
  at:
  - definitions
  - PolicyRequiredReviewersSettings
  value:
    type: object
    required:
    - scope
    - requiredReviewerIds
    properties:
      requiredReviewerIds:
        type: array
        items: &id001
          type: string
        minItems: 1
        description: Identity ids (users or groups).
      minimumApproverCount:
        type: integer
        format: int32
        minimum: 1
      creatorVoteCounts:
        type: boolean
      message:
        type: string
        description: Activity feed message.
      filenamePatterns:
        type: array
        items: *id001
        description: Paths the policy applies to (e.g. /src/*, !/docs/*); all paths when absent.
      scope:
        type: array
        minItems: 1
        items:
          type: object
          required:
          - repositoryId
          - refName
          - matchKind
          properties:
            repositoryId:
              type: string
              description: Repository id (GUID).
            refName:
              type: string
              description: e.g. refs/heads/main, or refs/heads/release/ with matchKind Prefix.
            matchKind:
              type: string
              enum:
              - Exact
              - Prefix
              - DefaultBranch
  reason: The Required reviewers settings as measured 2026-11-08 (the server fills minimumApproverCount 1 and creatorVoteCounts
    true when unset); shared by the request and the response.
- op: set
  at:
  - definitions
  - PolicyConfiguration
  - properties
  - settings
  value: &id002
    $ref: '#/definitions/PolicyRequiredReviewersSettings'
  reason: The source types settings as a free-form object; this document describes Required reviewers policies only,
    whose settings are returned exactly as sent plus server defaults (measured), so the response is typed the same
    way.
- op: set
  at:
  - definitions
  - PolicyRequiredReviewers
  value:
    description: The request fields of a Required reviewers branch policy.
    type: object
    required:
    - type
    - settings
    properties:
      isEnabled:
        type: boolean
        default: true
      isBlocking:
        type: boolean
        default: true
        description: Required (blocking) or optional.
      type:
        type: object
        description: Always the Required reviewers policy type (defaulted).
        default:
          id: fd2167ab-b0be-447a-8ec8-39368250530e
        required:
        - id
        properties:
          id:
            type: string
            enum:
            - fd2167ab-b0be-447a-8ec8-39368250530e
      settings: *id002
  reason: The source types policy settings as a free-form object; a branch policy is defined by its type-specific
    settings (Microsoft Learn, Policy Configurations - Create, 7.1, and the Required reviewers type). This kind
    fixes the type to Required reviewers (defaulted) and types its settings as measured 2026-11-08 (the server fills
    minimumApproverCount 1 and creatorVoteCounts true when unset). Several policies of this type may guard the same
    branch, even with identical settings (measured 2026-11-08). Scope matchKind is stored and returned capitalised
    (sent 'exact', read 'Exact'), so the enum uses the stored casing.
