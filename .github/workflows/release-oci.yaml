# Publishes this repo's two Helm charts (azuredevops-provider-kog, azuredevops-provider-kog-config) on a
# release tag, twice and with the same bytes, as krateo-blueprints/charts PUBLISHING.md requires: to GHCR,
# and to the helm index the Marketplace installs from. Both are done by ONE call to the org-wide reusable
# release-oci 2.1.0 (this file supplies the triggers, our OCI path, the index channel and the token), so
# "identical across every chart repo" is structural, not a copy kept in step. The repo-specific checks that
# the shared workflow does not make run first, in `preflight`.
#
# CHANNEL: `operators` for both charts. Neither ships a CompositionDefinition (PUBLISHING.md rule 2), and
# the publisher refuses a non-blueprint in `blueprints`. One tag publishes both at the same version.
name: release-oci

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      chart_version:
        description: "Chart version (CHART_VERSION). Default: the git tag."
        required: false
      app_version:
        description: "App image version (APP_VERSION). Default: latest tag of the app repo."
        required: false
      dry_run:
        description: "Build and check everything, push nothing. A manual run is a rehearsal unless this is unchecked."
        type: boolean
        default: true

jobs:
  # Everything that can refuse the release refuses it HERE, before GHCR holds anything. A failure after
  # the GHCR push would leave a version in GHCR and missing from the index (unpublished, per rule 1). Since
  # 2.1.0 the shared release-oci finishes that on a re-run of the same tag (it indexes every chart of the
  # release, pushed then or already published); refusing first still means there is nothing to finish.
  preflight:
    runs-on: ubuntu-latest
    permissions:
      actions: read # list this repo's lint runs
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve the chart version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.chart_version || '' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          v="${INPUT_VERSION:-$REF_NAME}"
          # Its shape (plain X.Y.Z, PUBLISHING.md rule 13) is checked by the shared release preflight.
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # PUBLISHING.md rule 10: THIS commit must have a concluded, successful run of lint.yaml (which runs
      # on every push to main, and includes oas-assets-fresh and render-check).
      - name: The commit being released must have passed lint
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          runs="repos/${REPO}/actions/workflows/lint.yaml/runs?head_sha=${SHA}&per_page=100"
          done_n=$(gh api "$runs" --jq '[.workflow_runs[] | select(.status == "completed")] | length')
          ok_n=$(gh api "$runs" --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          echo "lint runs on ${SHA}: ${done_n} completed, ${ok_n} successful"
          if [ "$done_n" -eq 0 ]; then
            echo "::error::No lint run exists for ${SHA}. Dispatch lint.yaml on it, confirm it passes, then re-tag."
            exit 1
          fi
          if [ "$ok_n" -eq 0 ]; then
            echo "::error::lint ran on ${SHA} but never succeeded. Refusing to publish."
            exit 1
          fi

      - uses: actions/checkout@v7
      # The shared workflow stamps CHART_VERSION wherever it appears. Both charts must carry it as their
      # version AND appVersion, so each publishes with appVersion equal to the tag (the collect job of the
      # 1.0.1 call asserted this after the push; it is a property of the source, so it is checked here).
      - name: Both charts take version and appVersion from the tag
        run: |
          set -euo pipefail
          for f in chart/Chart.yaml config-chart/Chart.yaml; do
            v=$(sed -n 's/^version: *//p' "$f" | tr -d '"'); a=$(sed -n 's/^appVersion: *//p' "$f" | tr -d '"')
            if [ "$v" != CHART_VERSION ] || [ "$a" != CHART_VERSION ]; then
              echo "::error::$f has version '$v' appVersion '$a'; both must be CHART_VERSION"
              exit 1
            fi
            echo "$f: version and appVersion are CHART_VERSION"
          done

      # The lint gate (retracted-pin) read oasgen-provider's retracted-versions.yaml when lint RAN, which can be
      # well before this tag: chart 0.11.0's lint read it at 08:42:11Z, five minutes before upstream changed it
      # (2026-11-16). A version retracted in between would otherwise ship. So read the list again here, against
      # the pin at THIS commit, with the same two controls as lint (0.66.0 refused with rc 1, 0.67.0 allowed). A
      # retracted pin (rc 1) or an unreadable list (rc 2) refuses the release before GHCR holds anything.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: The pin is not retracted (the list read now, not at lint time)
        run: |
          set -uo pipefail
          OASGEN_IMAGE=$(grep -oE 'ghcr\.io/krateo-platformops/oasgen-provider:[0-9]+\.[0-9]+\.[0-9]+' .github/workflows/lint.yaml | head -1)
          [ -n "$OASGEN_IMAGE" ] || { echo "::error::cannot read the oasgen-provider pin from lint.yaml at this commit"; exit 1; }
          export OASGEN_IMAGE; echo "pin at this commit: $OASGEN_IMAGE"
          rc=0; python3 hack/check-retracted.py --version 0.66.0 > control.out 2>&1 || rc=$?
          sed 's/^::error::/control, refused as expected: /' control.out
          [ "$rc" = 1 ] || { echo "::error::control: 0.66.0 gave rc=$rc, expected 1 (refused)"; exit 1; }
          python3 hack/check-retracted.py --version 0.67.0 || { echo "::error::control: 0.67.0 was refused"; exit 1; }
          python3 hack/check-retracted.py


  # The org's shared release, 2.1.0. Before anything is pushed it runs the release preflight (a plain X.Y.Z
  # version, PUBLISHING.md rules 12-13; this repo has no hack/release-preflight hook), checks the index token
  # for presence and shape (index-preflight), refuses a published version whose contents differ (skipping one
  # whose contents are identical), and passes every package through the index's own content gate (channel,
  # complete archive, sources, plain version). Then it pushes both charts to GHCR, pulls back every chart of the
  # release (pushed by this run, or already published with identical contents, so a re-run finishes a release
  # whose index step failed), and indexes those bytes through publish-chart (PUBLISHING.md rule 1). `index_channel: operators`:
  # neither chart ships a CompositionDefinition, and the publisher refuses a non-blueprint in `blueprints`.
  # Pinned by full commit SHA: it receives CHARTS_PUBLISH_TOKEN, an org-wide write token. Dependabot keeps it
  # current. A manual run defaults to dry_run (build and check everything, push nothing).
  release-oci:
    needs: preflight
    uses: krateo-platformops/.github/.github/workflows/release-oci.yaml@aa90d48e1a101d5e9b3e547bca116b97c49513b5 # 2.1.0
    permissions:
      contents: read
      packages: write
    with:
      chart_version: ${{ needs.preflight.outputs.version }}
      app_version: ${{ github.event.inputs.app_version || '' }}
      oci_repo: oci://ghcr.io/krateo-blueprints/charts
      index_channel: operators
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    secrets:
      charts_publish_token: ${{ secrets.CHARTS_PUBLISH_TOKEN }}
